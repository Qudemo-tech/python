# Production configuration for Render deployment
services:
  - type: web
    name: qudemo-python-backend
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-python312.txt
    startCommand: python start_production.py
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true